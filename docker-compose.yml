services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: smriti-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:16-alpine
    container_name: smriti-postgres
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: smriti
      POSTGRES_DB: smriti
    ports:
      - "5432:5432"
    volumes:
      - smriti_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smriti -d smriti"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  smriti_pg:
