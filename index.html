    <title>स्मृति सारथी — Smriti Saarthi</title>
    <script>
      (function () {
        // Universal self-recovery from stale PWA cache / missing chunk errors
        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || '';
          if (msg.indexOf('Loading chunk') !== -1 || msg.indexOf('Unexpected token') !== -1 || msg.indexOf('is not a function') !== -1) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if (window.caches) {
              caches.keys().then(function (names) {
                names.forEach(function (name) { caches.delete(name); });
              });
            }
            if (!sessionStorage.getItem('ss-reload-recovery')) {
              sessionStorage.setItem('ss-reload-recovery', '1');
              location.reload();
            }
          }
        });

        // Unregister broken service worker cache on reload if requested
        if (location.search.indexOf('reset=1') !== -1 || sessionStorage.getItem('ss-force-clean') === '1') {
          sessionStorage.removeItem('ss-force-clean');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches) {
            caches.keys().then(function (names) {
              names.forEach(function (name) { caches.delete(name); });
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
